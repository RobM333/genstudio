<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Founding sign-up form</title></head>
  <body>
    <!-- Netlify reads this file when the site is built, so it knows about the
         "founding" form. The real form is on /founding and posts here.
         Keep these fields in step with components/Founding.tsx. -->
    <form name="founding" data-netlify="true" netlify-honeypot="website" hidden>
      <input type="email" name="email">
      <input type="text" name="name">
      <input type="text" name="makes">
      <input type="text" name="website">
    </form>
  </body>
</html>
